name: jolt-tests

# The engine repository's "Build and test" workflow is the gate: it builds JoltTest at the revision pinned in
# Utilities/Scripts/TestPackages.json and runs it on Windows and Linux. This workflow is for a self-hosted Windows runner that has an
# engine SDK (set the repository variable PLASMA_SDK_ROOT), and only runs when started by hand, including the ten minute R0 soak.
on:
  workflow_dispatch:

jobs:
  headless:
    runs-on: [self-hosted, windows]
    env:
      PLASMA_SDK_ROOT: ${{ vars.PLASMA_SDK_ROOT }}
    steps:
      - uses: actions/checkout@v4

      - name: Regression checks (Development)
        shell: powershell
        run: ./Tests/Run-JoltTests.ps1 -Configuration Development

      - name: Soak scene (Debug, short)
        shell: powershell
        run: ./Tests/Run-JoltTests.ps1 -Configuration Debug -Filter JoltSoak -SoakSeconds 60

  r0-soak:
    # The R0 gate: ten minutes under the Debug allocator. Run on demand because of its length.
    runs-on: [self-hosted, windows]
    env:
      PLASMA_SDK_ROOT: ${{ vars.PLASMA_SDK_ROOT }}
    steps:
      - uses: actions/checkout@v4

      - name: Soak scene (Debug, ten minutes)
        shell: powershell
        run: ./Tests/Run-JoltTests.ps1 -Configuration Debug -Filter JoltSoak -SoakSeconds 600
